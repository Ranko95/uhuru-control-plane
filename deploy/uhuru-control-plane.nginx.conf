server {
    listen 80;
    listen [::]:80;
    server_name control.example.com;
    access_log off;
    error_log /dev/null crit;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / { return 404; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name control.example.com;
    ssl_certificate /etc/letsencrypt/live/control.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/control.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log off;
    error_log /dev/null crit;
    client_max_body_size 2m;
    proxy_cache off;
    proxy_request_buffering off;
    proxy_buffering off;

    location / {
        # No URI suffix: preserve /s/:secret exactly as sent by the client.
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }
}
