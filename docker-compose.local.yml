name: uhuru-local

services:
    db:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: uhuru
            POSTGRES_PASSWORD: uhuru
        command: [postgres, -c, config_file=/etc/postgresql/local.conf, -c, listen_addresses=*]
        ports:
            - 127.0.0.1:5432:5432
        volumes:
            - postgres-data:/var/lib/postgresql/data
            - ./deploy/postgresql-secrets.conf:/etc/postgresql/local.conf:ro
        healthcheck:
            test: [CMD-SHELL, pg_isready -U postgres -d uhuru]
            interval: 2s
            timeout: 5s
            retries: 30
        ulimits:
            core: 0

volumes:
    postgres-data:
